<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>クエストログ</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="クエスト">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090b;
  --panel:rgba(18,24,28,.72);
  --panel-solid:#11171b;
  --line:rgba(242,236,214,.14);
  --text:#f2ecd6;          /* 少し黄みがかった白 */
  --muted:#8e9894;
  --dim:#5b6461;
  --blue:#5fd4ef;          /* 発光アクセント */
  --blue-soft:rgba(95,212,239,.16);
  --orange:#f0a640;
  --red:#e8705f;
  --green:#9fd98a;
}
*{box-sizing:border-box}
:root{color-scheme:dark}
input[type=date],input[type=time]{color-scheme:dark;background:rgba(0,0,0,.35);color:var(--text);font-variant-numeric:tabular-nums}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.85) sepia(.3) hue-rotate(150deg) saturate(2);opacity:.7;cursor:pointer}
input[type=date]::-webkit-calendar-picker-indicator:hover,input[type=time]::-webkit-calendar-picker-indicator:hover{opacity:1}
input[type=date]::-webkit-datetime-edit,input[type=time]::-webkit-datetime-edit{color:var(--text)}
input[type=date]:invalid::-webkit-datetime-edit,input[type=time]:invalid::-webkit-datetime-edit{color:var(--dim)}
html,body{margin:0;height:100%;overflow-x:hidden}
body{
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%,rgba(95,212,239,.07),transparent 70%),
    radial-gradient(ellipse 120% 90% at 50% 120%,rgba(240,166,64,.05),transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  font-family:'Noto Sans JP',sans-serif;
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 110px}

/* ===== ヘッダー ===== */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
.brand{font-weight:900;letter-spacing:.18em;font-size:13px;color:var(--muted)}
.brand b{display:block;color:var(--text);font-size:22px;letter-spacing:.12em;font-style:italic}
.lv{min-width:190px;text-align:right}
.lv-row{display:flex;align-items:baseline;justify-content:flex-end;gap:10px}
.lv-num{font-weight:900;font-style:italic;font-size:22px}
.lv-num small{font-size:11px;color:var(--muted);margin-right:3px;font-style:normal;letter-spacing:.1em}
.lv-title{font-size:12px;color:var(--blue)}
.xp{height:3px;background:rgba(255,255,255,.08);margin-top:6px;position:relative;overflow:hidden}
.xp i{position:absolute;inset:0 auto 0 0;background:var(--blue);box-shadow:0 0 8px var(--blue);transition:width .6s}
.xp-txt{font-size:11px;color:var(--dim);margin-top:3px}
.sbadge{margin-left:10px;font-size:11px;letter-spacing:.05em}
.sbadge:empty{display:none}
.sbadge.busy{color:var(--blue);animation:blink 1.2s ease-in-out infinite}
.sbadge.ok{color:var(--dim)}
.sbadge.err{color:var(--red)}
@keyframes blink{50%{opacity:.35}}

/* ===== 現在の目標 ===== */
.hud{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 2px;margin-bottom:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.hud-label{font-size:11px;letter-spacing:.2em;color:var(--orange)}
.hud-item{display:flex;gap:10px;align-items:baseline;text-align:left;width:100%;min-width:0;padding:2px 0}
.hud-item:hover .hud-next{color:var(--text)}
.hud-q{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.hud-next{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-next::before{content:'▸ ';color:var(--blue)}
.hud-empty{color:var(--dim);font-size:13px}

/* ===== タブ ===== */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px 10px;font-size:14px;font-weight:700;color:var(--dim);white-space:nowrap;position:relative;letter-spacing:.04em}
.tab .n{font-size:11px;font-weight:500;margin-left:4px}
.tab.on{color:var(--text)}
.tab.on::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--text);box-shadow:0 0 10px rgba(242,236,214,.7)}

/* ===== 2ペイン ===== */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
.list{display:grid;gap:4px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border:1px solid transparent;border-radius:3px;transition:background .15s,border-color .15s,box-shadow .15s}
.row:hover{background:rgba(255,255,255,.035)}
.row.sel{border-color:rgba(242,236,214,.75);background:rgba(242,236,214,.06);box-shadow:0 0 14px rgba(242,236,214,.18),inset 0 0 12px rgba(242,236,214,.05)}
.r-mark{width:22px;display:flex;justify-content:center;flex:none}
.ico{display:inline-flex;width:16px;height:16px;vertical-align:-3px;flex:none}
.ico svg{width:100%;height:100%;overflow:visible}
.ico-main{width:22px;color:var(--orange)}
.ico-challenge{color:var(--blue)}
.ico-mini{color:var(--text)}
.row.done{opacity:.42}
.row.done .ico{color:var(--muted)}
.r-clear{font-size:11px;letter-spacing:.15em;color:var(--muted)}
.cat-bar{display:grid;justify-items:center;gap:6px;padding:4px 0 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.cat-name{font-size:12px;letter-spacing:.25em;color:var(--muted)}
.cat-icons{display:flex;gap:10px}
.cat{position:relative;width:44px;height:36px;display:grid;place-items:center;border-radius:4px;color:var(--dim);border:1px solid transparent;transition:all .15s}
.cat .ico{width:20px;height:20px;color:inherit}
.cat .ico-main{width:28px}
.cat:hover{color:var(--muted)}
.cat.on{color:var(--text);border-color:rgba(242,236,214,.6);box-shadow:0 0 12px rgba(242,236,214,.18);background:rgba(242,236,214,.05)}
.cat.on .ico-main{color:var(--orange)}.cat.on .ico-challenge{color:var(--blue)}
.cat-n{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--panel-solid);border:1px solid var(--line);font-size:10px;line-height:14px;color:var(--muted);font-style:normal}
.cat-list{position:relative;overflow:hidden;min-height:120px}
.cat-list .sec-bg{position:absolute;right:6px;top:6px;color:var(--text);opacity:.05;pointer-events:none}
.cat-main .sec-bg{width:60px;right:40px}.cat-challenge .sec-bg{width:260px}.cat-mini .sec-bg{width:240px;top:20px}
.cat-list .row,.cat-list .mini-add,.cat-list .toggle,.cat-list .sec-empty{position:relative}
.add-row .r-mark{color:var(--muted);font-size:16px}.add-row .r-title{color:var(--muted);font-weight:500}
.add-row:hover .r-title,.add-row:hover .r-mark{color:var(--blue)}
.r-clear{font-size:11px;font-style:italic;font-weight:900;letter-spacing:.12em;color:var(--orange)}
.d-giver{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:#d9d3be;margin:-4px 0 10px}
.giver-mark{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;font-style:normal;font-weight:900;margin-right:6px;vertical-align:-2px}
.d-place{color:var(--muted)}
.memo-wrap{position:relative}
.empty-memo{color:var(--dim)!important;font-size:13px!important}
.stamp{position:absolute;right:6px;top:-6px;transform:rotate(-8deg);font-size:28px;font-weight:900;font-style:italic;letter-spacing:.12em;color:var(--orange);opacity:.75;border:2px solid var(--orange);padding:0 10px;border-radius:4px;pointer-events:none;text-shadow:0 0 10px rgba(240,166,64,.4)}
.d-count{text-align:right;font-size:12px;letter-spacing:.12em;color:var(--muted);margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
.sec{position:relative;margin:6px 0 18px;padding:2px 0 4px;overflow:hidden;border-top:1px solid var(--line)}
.sec-bg{position:absolute;right:-6px;top:6px;color:var(--text);opacity:.06;pointer-events:none}
.sec-main .sec-bg{width:46px;right:18px;top:4px}
.sec-challenge .sec-bg{width:190px}
.sec-mini .sec-bg{width:170px;top:10px}
.sec-head{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;position:relative}
.sec-title{font-weight:900;font-style:italic;letter-spacing:.08em;font-size:15px}
.sec-main .sec-title{color:var(--orange)}
.sec-count{font-size:11px;color:var(--dim);letter-spacing:.08em}
.sec-add{margin-left:auto;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;color:var(--muted);font-size:15px;line-height:1}
.sec-add:hover{color:var(--blue);border-color:var(--blue);box-shadow:0 0 8px rgba(95,212,239,.35)}
.sec-empty{font-size:13px;color:var(--dim);padding:4px 12px 10px 42px}
.sec .row,.sec .mini-add{position:relative}
.mini-add{padding:0 12px 8px}
.r-main{flex:1;min-width:0;display:grid}
.r-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-side{flex:none;text-align:right;font-size:12px;color:var(--muted);display:grid;justify-items:end;gap:1px}
.r-pct{font-weight:700;color:var(--text);font-style:italic}
.row.done .r-title{color:var(--muted)}
.row.done .r-mark{color:var(--dim)}
.pin{color:var(--orange);font-size:10px;letter-spacing:.1em}
.qcheck{cursor:pointer;border-radius:4px;padding:2px 0}
.qcheck:hover .ico{color:var(--blue);filter:drop-shadow(0 0 4px var(--blue))}
.row.vanish{opacity:0;transform:translateX(12px);transition:all .25s}
.row.vanish .ico{color:var(--blue)}
.mini-add{padding:2px 0 8px}
.row:has(.qcheck){padding-top:9px;padding-bottom:9px}
.group-h{font-size:11px;letter-spacing:.2em;color:var(--dim);padding:12px 12px 4px}
.empty{color:var(--dim);font-size:14px;padding:28px 12px;line-height:1.9}
.toggle{font-size:12px;color:var(--dim);padding:12px;text-align:left}
.toggle:hover{color:var(--muted)}

/* ===== 詳細 ===== */
.detail{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:22px 22px 18px;position:sticky;top:14px;backdrop-filter:blur(6px);min-height:280px}
.detail .back{display:none;font-size:13px;color:var(--muted);margin-bottom:10px}
.d-type{font-size:11px;letter-spacing:.22em;color:var(--blue)}
.d-type.t-main{color:var(--orange)}
.d-type .ico{width:15px;height:15px;margin-right:2px}.d-type.t-main .ico{width:20px}
.d-title{font-size:24px;font-weight:900;line-height:1.35;margin:4px 0 10px;font-style:italic;letter-spacing:.02em}
.d-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-bottom:12px}
.stars{color:var(--orange);letter-spacing:1px}
.stars .off{color:var(--dim)}
.due.soon{color:var(--orange)}
.do{color:var(--blue)}
.day-h .hol{margin-left:10px;color:var(--red);font-weight:700;letter-spacing:.05em}
.wd.sun b{color:#f39a8c}
.conn-row{margin-bottom:10px;border-color:rgba(95,212,239,.5)!important}.conn-row .r-mark{color:var(--blue);font-size:16px}
@keyframes slideL{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
#list.slide-l .rows,#list.slide-l .week,#list.slide-l .day-h,#list.slide-l .cat-bar{animation:slideL .22s ease-out}
#list.slide-r .rows,#list.slide-r .week,#list.slide-r .day-h,#list.slide-r .cat-bar{animation:slideR .22s ease-out}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:0 0 10px}
.wd{display:grid;justify-items:center;gap:1px;padding:6px 0 4px;border:1.5px solid transparent;border-radius:6px;font-size:11px;color:var(--muted);background:rgba(0,0,0,.18)}
.wd b{font-size:16px;color:var(--text);font-weight:700}
.wd i{font-style:normal;font-size:7px;letter-spacing:1px;color:var(--blue);height:9px;line-height:9px}
.wd.sun span{color:var(--red)}.wd.sat span{color:var(--blue)}
.wd:hover{background:rgba(255,255,255,.05)}
.wd.on{border-color:rgba(255,255,245,.9);box-shadow:0 0 10px rgba(255,255,240,.3);background:rgba(242,236,214,.06)}
.day-h{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.12em;color:var(--muted);padding:2px 12px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.sq{display:block;width:11px;height:11px;border:1.4px solid var(--blue);transform:rotate(45deg)}
.sq.on{background:var(--blue)}
.srow .r-sub{color:var(--dim)}
.carry{margin-left:6px;font-size:.9em;color:var(--orange);opacity:.9}
.sdate{flex:none;font-size:11px;color:var(--dim);border:1px solid transparent;border-radius:10px;padding:1px 8px;margin-top:2px;white-space:nowrap}
.step:hover .sdate,.sdate:focus{border-color:var(--line);color:var(--muted)}
.sdate.on{color:var(--blue);border-color:rgba(95,212,239,.35)}
.step.done .sdate.on{color:var(--dim);border-color:transparent}
@media (hover:none){.step.pick .sdate{border-color:var(--line)}}
.sdate-row{display:flex;gap:8px;align-items:center;padding:6px 0 10px 28px;flex-wrap:wrap}
.sdate-row input{width:auto;flex:1;min-width:120px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:3px;padding:7px 10px;outline:none}
.sdate-row input:focus{border-color:var(--blue)}
.due.over{color:var(--red)}
.crumb{font-size:12px;color:var(--muted);margin-bottom:12px}
.crumb button{color:var(--blue);text-decoration:underline;text-underline-offset:3px}
.crumb.link{color:var(--orange);font-size:13px}
.crumb.link button{color:var(--orange)}
.memo{white-space:pre-wrap;color:#d9d3be;font-size:14px;margin:0 0 16px;line-height:1.85}
.bar{height:4px;background:rgba(255,255,255,.07);position:relative;margin:4px 0 4px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--text);box-shadow:0 0 8px rgba(242,236,214,.6);transition:width .5s}
.bar-txt{font-size:12px;color:var(--muted);text-align:right;margin-bottom:14px}
.sec-h{font-size:11px;letter-spacing:.22em;color:var(--dim);margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.step{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px dashed rgba(242,236,214,.07)}
.chk{flex:none;width:18px;height:18px;margin-top:3px;border:1.5px solid var(--muted);border-radius:2px;transform:rotate(45deg) scale(.82);transition:all .2s;position:relative}
.chk:hover{border-color:var(--blue);box-shadow:0 0 8px var(--blue)}
.step.done .chk{background:var(--blue);border-color:var(--blue);box-shadow:0 0 10px var(--blue)}
.step-t{flex:1;min-width:0;word-break:break-word}
.step.done .step-t{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.2)}
.step.next .step-t{color:var(--text);font-weight:700}
.step.next .step-t::after{content:'次の一手';font-size:10px;font-weight:500;color:var(--bg);background:var(--blue);padding:1px 6px;border-radius:2px;margin-left:8px;vertical-align:2px;letter-spacing:.08em}
.add{display:flex;gap:8px;margin-top:8px}
.add input{flex:1;min-width:0}
input[type=text],input[type=date],input[type=time],select,textarea{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:3px;padding:8px 10px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue-soft)}
textarea{resize:vertical;min-height:70px;line-height:1.7}
select option{background:var(--panel-solid)}
::placeholder{color:var(--dim)}
.kids{display:grid;gap:2px}
.kid{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;text-align:left;width:100%;font-size:14px;border-bottom:1px dashed rgba(242,236,214,.07)}
.kid:hover{color:var(--blue)}
.kid .k-pct{color:var(--muted);font-size:12px;flex:none}
.kid.done{color:var(--dim)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);padding:8px 14px;border-radius:3px;font-size:13px;font-weight:700;letter-spacing:.04em;transition:all .15s}
.btn:hover{border-color:var(--text);box-shadow:0 0 10px rgba(242,236,214,.2)}
.btn.primary{border-color:var(--blue);color:var(--blue)}
.btn.primary:hover{background:var(--blue-soft);box-shadow:0 0 12px rgba(95,212,239,.35)}
.btn.gold{border-color:var(--orange);color:var(--orange)}
.btn.gold:hover{background:rgba(240,166,64,.12);box-shadow:0 0 12px rgba(240,166,64,.35)}
.btn.on{background:rgba(240,166,64,.14);border-color:var(--orange);color:var(--orange)}
.btn.danger{color:var(--red);border-color:rgba(232,112,95,.35)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.small{padding:4px 10px;font-size:12px;white-space:nowrap;flex:none}
.ready{border:1px solid var(--orange);color:var(--orange);padding:10px 12px;margin-top:14px;font-size:13px;border-radius:3px;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 14px rgba(240,166,64,.35)}}
.d-empty{color:var(--dim);display:grid;place-items:center;min-height:240px;text-align:center;font-size:14px;line-height:2}

/* 編集フォーム */
.form{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.f label{display:block;font-size:11px;letter-spacing:.15em;color:var(--muted);margin-bottom:4px}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.rank-pick{display:flex;gap:2px}
.rank-pick button{font-size:20px;color:var(--dim);padding:0 2px;line-height:1}
.rank-pick .rank-clr{font-size:13px;margin-left:8px;color:var(--muted)}.rank-un{margin-left:8px;align-self:center}
.rank-pick button.on{color:var(--orange);text-shadow:0 0 8px rgba(240,166,64,.6)}
.estep{display:flex;gap:6px;align-items:center}
.estep input,.estep select{flex:1;min-width:0}
select{max-width:100%;text-overflow:ellipsis}
.estep .ic{color:var(--dim);width:26px;height:30px;font-size:13px;border-radius:3px}
.estep .ic:hover{color:var(--text);background:rgba(255,255,255,.06)}
.hint{font-size:12px;color:var(--dim)}
.qico{flex:none;width:18px;height:22px;color:var(--blue);font-size:15px;line-height:1;margin-top:1px}
.qstep.done .qico{color:var(--dim)}
.qstep .step-t{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.qlink{color:var(--blue);font-weight:700;text-align:left;text-decoration:underline;text-decoration-color:rgba(95,212,239,.35);text-underline-offset:4px}
.qstep.done .qlink{color:var(--dim);text-decoration:line-through}
.qpct{font-size:12px;color:var(--muted);font-style:italic}
.qnext{flex-basis:100%;order:3;font-size:12px;color:var(--muted);font-weight:400}
.qstep.next .step-t::after{order:2}
.eref{flex:1;min-width:0;padding:8px 10px;border:1px dashed rgba(95,212,239,.4);border-radius:3px;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eref small{color:var(--dim);margin-left:8px;font-size:11px}
.estep .promote{width:auto;padding:0 8px;font-size:11px;color:var(--blue);border:1px solid rgba(95,212,239,.35)}

/* 道具 */

/* FAB */

/* トースト・達成演出 */
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--panel-solid);border:1px solid var(--line);padding:9px 18px;border-radius:3px;font-size:13px;transition:all .3s;z-index:40;pointer-events:none;white-space:nowrap}

.clear{position:fixed;inset:0;display:grid;place-items:center;z-index:50;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(40,44,42,.92),rgba(3,4,5,.96) 65%);backdrop-filter:blur(4px)}
.clear.show{animation:clearIn 2.6s ease forwards}

.clear-xp{font-size:13px;color:var(--blue);margin-top:6px}
@keyframes clearIn{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes line{to{width:min(420px,80vw)}}
.flash{animation:flash .6s}

  if(canLink(n,q)) n.parentId=q.id; else if(canLink(n,findQ(q.parentId))) n.parentId=q.parentId;
  state.quests.push(n); s.qref=n.id; save();
  renderEdit($('detail'),q); renderList(); renderTabs(); renderHud();
  toast('チャレンジに格上げしました');
}
function insertRef(q,id){
  const r=findQ(id); if(!r||q.steps.some(s=>s.qref===id)||contains(r,q)) return;
  q.steps.push({id:uid(),text:r.title,done:false,qref:id});
  if(!r.parentId&&canLink(r,q)) r.parentId=q.id;
  save(); renderEdit($('detail'),q); renderList();
}
function demoteStep(q,sid){
  const i=q.steps.findIndex(x=>x.id===sid), s=q.steps[i], r=refQ(s); if(!r) return;
  if(r.steps.length && !confirm(`「${r.title}」を工程に戻します。\n中の工程${r.steps.length}個は、そのすぐ後ろに並びます。`)) return;
  s.qref=null; s.text=r.title; s.done=!!r.done;
  q.steps.splice(i+1,0,...r.steps.map(x=>({...x,id:uid()})));
  state.quests.forEach(o=>o.steps.forEach(x=>{if(x.qref===r.id){x.qref=null;x.text=r.title;x.done=!!r.done}}));
  state.quests=state.quests.filter(o=>o!==r);
  save(); renderEdit($('detail'),q); renderList(); renderTabs(); renderHud();
  toast('工程に戻しました');
}
let moveSid=null, dateSid=null;
function moveStep(q,sid,tid){
  const t=findQ(tid), i=q.steps.findIndex(x=>x.id===sid); if(!t||i<0) return;
  const s=q.steps[i], r=refQ(s);
  if(r&&(r.id===t.id||contains(r,t))){toast('そこには移せません');return}
  q.steps.splice(i,1); t.steps.push(s); moveSid=null;
  save(); renderEdit($('detail'),q); renderList(); renderHud();
  toast(`「${t.title||'(無題)'}」に移しました`);
}
function deleteQuest(q){
  if(!confirm(`「${q.title||'(無題)'}」を削除する？`)) return;
  kids(q.id).forEach(k=>k.parentId=canLink(k,findQ(q.parentId))?q.parentId:null);
  state.quests.forEach(o=>o.steps.forEach(x=>{if(x.qref===q.id){x.qref=null;x.text=q.title||x.text;x.done=!!q.done}}));
  state.quests=state.quests.filter(x=>x!==q); selId=null; editing=false; save(); render();
}
function addSteps(q,text){
  const lines=text.split(/\r?\n/).map(s=>s.replace(/^\s*([-*・●○◇◆□■]|\d+[.)．]|\[\s?\])\s*/,'').trim()).filter(Boolean);
  lines.forEach(l=>q.steps.push(st(l)));
  if(lines.length){save();render();if(lines.length>1)toast(`${lines.length}個の工程を追加`);}
  return lines.length;
}

function dayItems(d){
  const out=[];
  state.quests.forEach(q=>{
    if(!(q.steps&&q.steps.length)&&q.doDate===d) out.push({q,time:q.doTime||''});
    if(q.done) return;
    (q.steps||[]).forEach(st=>{ if(!st.qref&&st.doDate===d) out.push({q,s:st,time:st.doTime||''}); });
  });
  const dn=x=>x.s?!!x.s.done:!!x.q.done;
  const tk=x=>x.time||'99';
  return out.sort((a,b)=>(dn(a)-dn(b))||(tk(a)<tk(b)?-1:tk(a)>tk(b)?1:0));
}
// 日本の祝日（振替休日・国民の休日を含む）。名前を返し、祝日でなければ空文字
const _hol={};
function jpHolidays(y){
  if(_hol[y]) return _hol[y];
  const h={}, k=(m,d)=>y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  const nthMon=(m,n)=>{ const f=new Date(y,m-1,1).getDay(); return 1+((8-f)%7)+(n-1)*7; };
  h[k(1,1)]='元日'; h[k(1,nthMon(1,2))]='成人の日'; h[k(2,11)]='建国記念の日'; h[k(2,23)]='天皇誕生日';
  h[k(3,Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)))]='春分の日';
  h[k(4,29)]='昭和の日'; h[k(5,3)]='憲法記念日'; h[k(5,4)]='みどりの日'; h[k(5,5)]='こどもの日';
  h[k(7,nthMon(7,3))]='海の日'; h[k(8,11)]='山の日'; h[k(9,nthMon(9,3))]='敬老の日';
  h[k(9,Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4)))]='秋分の日';
  h[k(10,nthMon(10,2))]='スポーツの日'; h[k(11,3)]='文化の日'; h[k(11,23)]='勤労感謝の日';
  // 国民の休日（祝日にはさまれた平日）
  for(let d=new Date(y,0,2); d.getFullYear()===y; d.setDate(d.getDate()+1)){
    const a=new Date(d), b=new Date(d); a.setDate(a.getDate()-1); b.setDate(b.getDate()+1);
    if(!h[ymd(d)]&&d.getDay()!==0&&h[ymd(a)]&&h[ymd(b)]) h[ymd(d)]='国民の休日';
  }
  // 振替休日（日曜の祝日の次の、祝日でない日）
  Object.keys(h).sort().forEach(key=>{ const d=new Date(key+'T00:00:00'); if(d.getDay()!==0) return; const n=new Date(d); do{ n.setDate(n.getDate()+1); }while(h[ymd(n)]); if(n.getFullYear()===y) h[ymd(n)]='振替休日'; });
  return _hol[y]=h;
}
const holiday=key=>key?(jpHolidays(+key.slice(0,4))[key]||''):'';

}

  for(let y=0;y<S;y++) for(let X=0;X<S;X++){ const p=(y*S+X)*4; if(d[p+3]<10) continue; let best=1e9, res=[0,0,0];
    for(const [dx,dy] of [[-r,-r],[0,-r],[-r,0],[0,0]]){ let a=0,g=0,b=0,s2=0,n=0;
      for(let j=0;j<=r;j++) for(let i=0;i<=r;i++){ const xx=X+dx+i, yy=y+dy+j; if(xx<0||yy<0||xx>=S||yy>=S) continue; const q=(yy*S+xx)*4; if(d[q+3]<10) continue; const l=d[q]*.3+d[q+1]*.59+d[q+2]*.11; a+=d[q]; g+=d[q+1]; b+=d[q+2]; s2+=l*l; n++; }

function fitTitles(){
  document.querySelectorAll('#list .r-title').forEach(el=>{
    el.style.fontSize=''; el.classList.remove('two'); el.style.whiteSpace='nowrap'; el.style.overflow='hidden';
    const w=el.clientWidth; if(!w){ el.style.whiteSpace=''; el.style.overflow=''; return; }
    if(el.scrollWidth<=w){ el.style.overflow=''; return; } // 1行に収まる
    el.style.overflow='';
    const base=parseFloat(getComputedStyle(el).fontSize), r=w/el.scrollWidth;
    if(r>=0.8){ el.style.fontSize=(base*r*0.97).toFixed(1)+'px'; if(el.scrollWidth>el.clientWidth) el.style.whiteSpace=''; }
    else { el.style.fontSize=(base*0.86).toFixed(1)+'px'; el.style.whiteSpace=''; el.classList.add('two'); }
  });

        if(pickSid===s.id&&!dn&&!q.done) h+=`<li class="shrine-row"><button data-act="shrine" data-q="${q.id}" data-s="${s.id}"><i class="sh-ico"></i>この工程で祠に挑む<small>25分だけ集中</small></button></li>`;
        if(dateSid===s.id) h+=`<li class="sdate-row"><input type="date" data-sdate="${s.id}" value="${esc(s.doDate||'')}"><input type="time" data-stime="${s.id}" value="${esc(s.doTime||'')}"><button class="btn small ghost" data-act="sdateclear" data-s="${s.id}">消す</button><button class="btn small" data-act="sdateclose">OK</button></li>`;
      }
    });
    h+=`</ul>`;
    if(!q.done) h+=`<div class="add"><input type="text" id="quickAdd" placeholder="工程を追加（Enter／箇条書きを貼り付けで一括）"></div>`;
  }
  if(q.type==='main'){
    const kidRow=k=>`<button class="kid ${k.done?'done':''}" data-act="select" data-id="${k.id}"><span>${ico(k.type,k.done)} ${esc(k.title||'(無題)')}</span><span class="k-pct">${k.done?'COMPLETE':Math.round(progress(k)*100)+'%'}</span></button>`;
    const open=ks.filter(k=>!k.done&&!q.steps.some(s=>s.qref===k.id)), done=ks.filter(k=>k.done);
    h+=`<div class="sec-h"><span>このシナリオのためのチャレンジ</span>${q.done?'':`<button class="btn small ghost" data-act="addchild">＋ 追加</button>`}</div>`;
    h+=open.length?`<div class="kids">${open.map(kidRow).join('')}</div>`:`<div class="hint">チャレンジを作るときに、このメインを選ぶとここに並びます</div>`;
    if(done.length) h+=`<div class="kids">${done.map(kidRow).join('')}</div>`;
  }
  if(q.done&&q.type!=='mini'){
    h+=`<div class="sec-h"><span>思い出</span>${q.memory&&memEdit!==q.id?`<button class="btn small ghost" data-act="memedit">書き直す</button>`:''}</div>`;
    if(q.memory&&memEdit!==q.id) h+=`<div class="p-desc mem-text">${esc(q.memory).split('\n').map(l=>`<p>${l||'&nbsp;'}</p>`).join('')}</div>`;
    else h+=`<div class="mem-form"><textarea id="memIn" placeholder="ひとこと残そう（何がうれしかった？ 何を学んだ？ 次はどうしたい？）">${esc(q.memory||'')}</textarea><button class="btn primary small" data-act="memsave">思い出に残す</button></div>`;
  }
  h+=q.done?`<div class="p-acts m-only"><button class="btn" data-act="reopen">未達成に戻す</button></div>`:`<div class="p-acts m-only"><button class="btn gold" data-act="complete">達成を報告</button><button class="btn ${q.accepted?'on':''}" data-act="accept">${q.accepted?'目的地を解除':'目的地を設定'}</button></div>`;
  if(!q.done && allStepsDone(q)) h+=`<div class="ready">すべての工程をクリアしました。達成を報告しよう！</div>`;
  { const all=state.quests.filter(x=>x.type===q.type); h+=`<div class="p-count">${TYPES[q.type].label}クリア　${all.filter(x=>x.done).length}/${all.length}</div>`; }
  h+=`</div>`;
  D.innerHTML=h;
}
// 日付の入力欄の値を工程に反映（OKを押したときだけ）
function applyDateRow(){
  if(!dateSid) return; const q=findQ(selId), st=q&&q.steps.find(x=>x.id===dateSid); if(!st) return;
  const d=document.querySelector(`[data-sdate="${dateSid}"]`), t=document.querySelector(`[data-stime="${dateSid}"]`); if(!d) return;
  const nd=d.value||'', nt=(t&&t.value)||'';
  if(nd===(st.doDate||'')&&nt===(st.doTime||'')) return;
  if(nd!==(st.doDate||'')) st.carry=0;
  st.doDate=nd||(nt?ymd():''); st.doTime=nt; save(); renderList();
}
function hint(act,label,key,cls=''){return `<button class="hint-b ${cls}" data-act="${act}"><span>${label}</span>${key?`<i>${key}</i>`:''}</button>`}
function renderHints(){
  const q=tab==='list'?findQ(selId):null; let h='';
  if(tab==='rest'){ h=''; }
  else if(tab==='pouch'){ h=pouchSel?hint('back','閉じる','B'):''; }
  else if(tab==='tools'){ h=toolPicked?hint('back','閉じる','B'):''; }
  else if(!q&&listCat==='memory'){ h=''; }
  else if(!q&&listCat==='train'){ h=trSel?hint('trback','閉じる','B'):''; }
  else if(!q){ h=hint('newcur',listCat==='today'?'この日にチャレンジを追加':`新しい${CAT_NAMES[listCat]}`,'X'); }
  else if(editing){ h=(q===draft?hint('delete','やめる','B'):hint('delete','削除','','danger'))+hint('doneedit',q===draft?'登録する':'完了','A','gold'); }
  else if(q.done){ h=hint('back','閉じる','B')+hint('edit','編集','Y')+hint('reopen','未達成に戻す','','pc-only'); }
  else { h=hint('back','閉じる','B')+hint('edit','編集','Y')+hint('complete','達成を報告','X','gold pc-only')+hint('accept',q.accepted?'目的地を解除':'目的地を設定','A',(q.accepted?'on ':'')+'pc-only'); }
  $('hints').innerHTML=h;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, q=findQ(selId);
  switch(a){
    case 'tab': if(!draftLeave()) break; if(editing){cleanupEmpty();editing=false} tab=b.dataset.v; if(window.innerWidth<=820) selId=null; render(); break;
    case 'openq': { const t=findQ(b.dataset.id); if(!t) break; tab='list'; listCat=t.type; selId=t.id; pouchSel=null; editing=false; render(); window.scrollTo({top:0}); break; }
    case 'bulkon': if(editing){ editing=false; save(); } bulkSel=new Set(); dateSid=null; pickSid=null; render(); window.innerWidth<=820&&window.scrollTo({top:0}); break;
    case 'bulkoff': bulkSel=null; renderDetail(); break;
    case 'bulkall': { if(!bulkSel||!q) break; const all=q.steps.filter(x=>!x.qref&&!stepDone(x)); const d=($('bulkDate')||{}).value, t=($('bulkTime')||{}).value;
      if(all.every(x=>bulkSel.has(x.id))) bulkSel.clear(); else all.forEach(x=>bulkSel.add(x.id));
      renderDetail(); if($('bulkDate')){ $('bulkDate').value=d||''; $('bulkTime').value=t||''; } break; }
    case 'bulkpick': bulkSel&&(bulkSel.has(b.dataset.s)?bulkSel.delete(b.dataset.s):bulkSel.add(b.dataset.s)); { const d=($('bulkDate')||{}).value, t=($('bulkTime')||{}).value; renderDetail(); if($('bulkDate')){ $('bulkDate').value=d||''; $('bulkTime').value=t||''; } } break;
    case 'bulkapply': case 'bulkclear': { if(!bulkSel||!bulkSel.size){ toast('工程を選んでください'); break; } const d=a==='bulkclear'?'':($('bulkDate')||{}).value, t=a==='bulkclear'?'':($('bulkTime')||{}).value;
      if(a==='bulkapply'&&!d){ toast('日付を選んでください'); break; }
      q.steps.forEach(st=>{ if(bulkSel.has(st.id)){ if(st.doDate!==d) st.carry=0; st.doDate=d; st.doTime=t||''; } });
      const n=bulkSel.size; bulkSel=null; save(); render(); toast(a==='bulkclear'?`${n}件の日付を外しました`:`${n}件の工程に日付を入れました`); break; }
    case 'matadd': { const el=$('matName'); const v=(el&&el.value||'').trim(); if(!v){ el&&el.focus(); break; } matAdd(v,(($('matStoreIn')||{}).value||'').trim()); renderDetail(); renderList(); setTimeout(()=>{ const n=$('matName'); n&&n.focus(); },20); break; }
    case 'matsug': matAdd(b.dataset.v,matStore); renderDetail(); renderList(); break;
    case 'matget': { const x=(state.mats||{})[b.dataset.v]; if(!x) break; x.got=!x.got; x.u=Date.now(); matJust=x.got?b.dataset.v:null; save(); renderDetail(); renderList(); setTimeout(()=>{ matJust=null; },900);
      if(x.got&&!matsAll().some(m=>!m.got&&(!matStore||m.store===matStore))) setTimeout(()=>banner('reward','素材がそろった',matStore||'買い物おつかれさま'),500); break; }
    case 'matdel': { const x=(state.mats||{})[b.dataset.v]; if(!x) break; x.del=1; x.u=Date.now(); save(); renderDetail(); renderList(); break; }
    case 'matclear': { const now=Date.now(); matsAll().filter(x=>x.got).forEach(x=>{ state.mats[x.id].del=1; state.mats[x.id].u=now; }); save(); renderDetail(); renderList(); toast('手に入れた素材を片づけました'); break; }
    case 'matstore': matStore=b.dataset.v; renderDetail(); break;
    case 'pickstep': pickSid=pickSid===b.dataset.s?null:b.dataset.s; renderDetail(); break;
    case 'select': if(!draftLeave()) break; bulkSel=null; applyDateRow(); dateSid=null; pickSid=null; if(editing){cleanupEmpty();editing=false} selId=b.dataset.id; render(); window.innerWidth<=820&&window.scrollTo({top:0}); break;

        state.chap.cur={n:c.n+1,theme:(($('chTheme')||{}).value||'').trim(),rule:(($('chRule')||{}).value||'').trim(),start:ns,end:chEnd(ns)}; state.chap.u=Date.now();

// 複数行の貼り付け：行頭が「・」「-」「1.」などの箇条書きなら行ごとに分けて追加、ふつうの文章なら1行につなげて入力欄に入れる
const LIST_RE=/^\s*([-*・●○◇◆□■]|\d+[.)．]|[①-⑳]|\[\s?\])\s*/;
function joinLines(t){ const ls=t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean); const cjk=/[\u3000-\u30ff\u3400-\u9fff\uff00-\uffef]/;
  return ls.reduce((a,l)=>a?(cjk.test(a.slice(-1))&&cjk.test(l[0])?a+l:a+' '+l):l,''); }
document.addEventListener('paste',e=>{

    if(id==='miniAdd'){ addMinis(t); return; }
    const q=findQ(selId); if(!q) return; addSteps(q,t); const n=$('quickAdd'); n&&n.focus(); return;
  }
  const el=e.target, v=el.value, a=el.selectionStart??v.length, b=el.selectionEnd??v.length, j=joinLines(t);
  el.value=v.slice(0,a)+j+v.slice(b); const c=a+j.length; try{ el.setSelectionRange(c,c); }catch(_){}
});

document.addEventListener('pointermove',e=>{

  e.preventDefault();
  const others=[...drag.list.querySelectorAll(':scope > [data-sid]')].filter(x=>x!==drag.item);
  let before=null;
  for(const it of others){const r=it.getBoundingClientRect(); if(e.clientY<r.top+r.height/2){before=it;break}}
  const ref=before || (others.length?others[others.length-1].nextSibling:null);
  if(ref!==drag.item && drag.item.nextSibling!==ref) drag.list.insertBefore(drag.item,ref);
  if(e.clientY<70) window.scrollBy(0,-12); else if(e.clientY>window.innerHeight-70) window.scrollBy(0,12);
},{passive:false});
function endDrag(){
  if(!drag) return;
  const order=[...drag.list.querySelectorAll(':scope > [data-sid]')].map(x=>x.dataset.sid);
  const q=drag.q, mid=drag.item.dataset.sid; drag.item.classList.remove('dragging'); document.body.classList.remove('is-dragging'); drag=null;
  if(!q) return;
  const before=q.steps.map(x=>x.id).join();
  q.steps.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  if(q.steps.map(x=>x.id).join()===before) return;
  // 日付のない工程を、日付のある工程より上へ動かしたら、その位置に合う日付を自動で入れる
  { const i=q.steps.findIndex(x=>x.id===mid), m=q.steps[i], dd=x=>{ const r=x.qref?findQ(x.qref):null; return (r||x).doDate||''; };
    if(m&&!m.qref&&!m.doDate&&!stepDone(m)){
      const below=q.steps.slice(i+1).find(x=>!stepDone(x)&&dd(x));
      if(below){ const above=q.steps.slice(0,i).reverse().find(x=>dd(x)); m.doDate=above?dd(above):dd(below); m.carry=0; toast(`「${m.text}」のやる日を ${m.doDate.slice(5).replace('-','/')} にしました`); }
    } }
  save(); editing ? renderEdit($('detail'),q) : (renderDetail(), renderList(), renderHud());
}

/* ---------- Googleカレンダー同期 ---------- */
const SKEY='questlog-sync';
var sync=(()=>{try{return JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){return {}}})();
sync.sigs=sync.sigs||{}; sync.pending=sync.pending||{};
function saveSync(){try{localStorage.setItem(SKEY,JSON.stringify(sync))}catch(e){}}
const pad=n=>String(n).padStart(2,'0');
// つなぐコード：URLと合言葉を1つの文字列にまとめたもの（ホーム画面のアプリなど、別の保存場所へ設定を移す用）
function makeConnectCode(){ return 'QL1-'+btoa(unescape(encodeURIComponent(JSON.stringify({u:sync.url,t:sync.token||''})))); }
function readConnectCode(c){ try{ const m=String(c).trim().match(/QL1-([A-Za-z0-9+/=]+)/); if(!m) return null; const o=JSON.parse(decodeURIComponent(escape(atob(m[1])))); return o&&/^https:\/\/script\.google\.com\//.test(o.u)?o:null; }catch(e){ return null; } }
function syncStatusText(){
  if(!sync.url) return '未接続です。設定方法はClaudeに聞いてください。';
  const pend=Object.keys(sync.pending||{}).length;
  if(sync.err) return `⚠ 同期エラー：${esc(sync.err)}（${pend}件が送信待ち）`;
  const t=Math.max(sync.last||0,sync.dataAt||0);
  return t ? `接続中 ・ 最終同期：${new Date(t).toLocaleString('ja-JP')}${pend?`（カレンダー${pend}件が送信待ち）`:''}` : '接続済み';
}
function calPayload(q){
  const m=ancestors(q).find(a=>a.type==='main');
  return {v:3,id:q.id,title:q.title||'(無題)',date:q.doDate,time:q.doTime||'',done:!!q.done,
    main:m?(m.title||''):'',memo:q.memo||'',steps:q.steps.map(s=>({t:stepText(s),d:stepDone(s)})),
    link:location.origin+location.pathname+'#q='+q.id};
}
function stepPayload(q,s){
  const m=q.type==='main'?q:ancestors(q).find(a=>a.type==='main');
  return {v:3,id:q.id+'~'+s.id,title:`${s.text}｜${q.title||'(無題)'}`,date:s.doDate,time:s.doTime||'',done:!!s.done,
    main:m?(m.title||''):'',memo:`「${q.title||'(無題)'}」の工程`,steps:[],link:location.origin+location.pathname+'#q='+q.id};
}
function calEntities(){
  const out={};
  state.quests.forEach(q=>{
    if(q.doDate) out[q.id]=calPayload(q);
    q.steps.forEach(s=>{ if(!s.qref&&s.doDate) out[q.id+'~'+s.id]=stepPayload(q,s); });
  });
  return out;
}
function entTarget(eid){
  const [qid,sid]=eid.split('~'); const q=findQ(qid); if(!q) return null;
  return sid ? (q.steps.find(x=>x.id===sid&&!x.qref)||null) : q;
}
const CAL_SYNC=false; // Googleカレンダー連携は停止中（PCとスマホのデータ同期は有効）
function syncScan(){
  if(!sync.url||!CAL_SYNC) return;
  const ents=calEntities();
  Object.entries(ents).forEach(([id,pl])=>{ if(sync.sigs[id]!==JSON.stringify(pl)) sync.pending[id]='u'; });
  Object.keys(sync.sigs).forEach(id=>{ if(!ents[id]) sync.pending[id]='d'; });
  saveSync(); if(Object.keys(sync.pending).length){ scheduleFlush(); } syncBadge();
}
let flushT=null, flushing=false, errShown=false;
function scheduleFlush(ms=1200){clearTimeout(flushT); flushT=setTimeout(flush,ms)}
let gasQ=Promise.resolve(), inflight=0;
function gas(body){ const p=gasQ.then(()=>gasRaw(body)); gasQ=p.catch(()=>{}); return p; }
function syncBadge(){
  const el=$('syncBadge'); if(!el) return;
  if(!sync.url){ el.textContent=''; el.className='sbadge'; return; }
  if(inflight>0||Object.keys(sync.pending||{}).length){ el.textContent='同期中…'; el.className='sbadge busy'; }
  else if(sync.err){ el.textContent='⚠ 同期エラー'; el.className='sbadge err'; }
  else { el.textContent='同期済み'; el.className='sbadge ok'; }
}
async function gasRaw(body){
  inflight++; syncBadge();
  try{ return await gasFetch(body); } finally{ inflight--; syncBadge(); }
}
async function gasFetch(body){
  const r=await fetch(sync.url,{method:'POST',body:JSON.stringify({token:sync.token,...body})});
  let j; try{ j=await r.json(); }catch(e){ throw new Error('スクリプトから正しい返事がありません（URLか公開設定を確認）'); }
  if(!j.ok) throw new Error(j.error||'不明なエラー'); return j;
}
function refreshStatus(){const el=$('syncStatus'); if(el) el.innerHTML=syncStatusText(); syncBadge();}
async function flush(manual){
  if(!sync.url||flushing||!CAL_SYNC) return;
  const ids=Object.keys(sync.pending); if(!ids.length){ if(manual) toast('同期済みです'); return; }
  flushing=true;
  const ups=[],dels=[],sent={};
  const ents=calEntities();
  ids.forEach(id=>{ if(sync.pending[id]==='u'&&ents[id]){ ups.push(ents[id]); sent[id]=JSON.stringify(ents[id]); } else dels.push(id); });
  try{
    await gas({action:'sync',upserts:ups,deletes:dels});
    const now=calEntities();
    ups.forEach(pl=>{ sync.sigs[pl.id]=sent[pl.id]; if(now[pl.id]&&JSON.stringify(now[pl.id])===sent[pl.id]) delete sync.pending[pl.id]; });
    dels.forEach(id=>{ delete sync.sigs[id]; if(!now[id]) delete sync.pending[id]; });
    sync.last=Date.now(); sync.err=''; errShown=false; saveSync();
    if(manual) toast('カレンダーと同期しました');
  }catch(err){
    sync.err=String(err.message||err); saveSync();
    if(!errShown||manual){ toast('カレンダー同期に失敗：'+sync.err); errShown=true; }
    scheduleFlush(30000);
  }finally{ flushing=false; refreshStatus(); if(Object.keys(sync.pending).length&&!sync.err) scheduleFlush(); }
}
async function pull(){
  if(!sync.url||!CAL_SYNC) return;
  try{
    const j=await gas({action:'pull'}); let ch=0;
    Object.entries(j.dates||{}).forEach(([id,v])=>{
      const t=entTarget(id); if(!t||!t.doDate||sync.pending[id]) return;
      if(t.doDate!==v.date||(t.doTime||'')!==(v.time||'')){ t.doDate=v.date; t.doTime=v.time||''; ch++; }
    });
    if(ch){ save(); render(); toast(`カレンダーで動かした予定を${ch}件反映しました`); }
  }catch(e){}
}

function hexMix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)), x=p(a), y=p(b);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')}
// 地面の色：遠いほど空の色に溶ける（haze）→ 時間帯の色をかぶせる
function bgC(tm,hex,haze=0){const T=BG_TIME[tm]; let c=hexMix(hex,T.sky,haze); return hexMix(c,T.tint,T.a)}

    h=`${moonPhaseSvg(key)}<div class="moon-k">DAY END</div><h2>${d.getMonth()+1}/${d.getDate()}（${'日月火水木金土'[d.getDay()]}）の冒険</h2><p class="moon-lead">今日の冒険をふり返って、明日にそなえよう</p>
    <div class="sec-h"><span>クリアしたもの</span><span>${D.qs.length+D.steps.length+(D.tr?1:0)}件</span></div>
    ${D.qs.length||D.steps.length||D.tr?`<div class="kids">${D.qs.map(q=>kidLine(ico(q.type,true)+' '+esc(q.title||'(無題)'))).join('')}${revGroup(D.steps.map(x=>({q:x.q,s:x.st})),'◆')}${D.tr?kidLine(ico('train')+' 鍛錬'):''}</div>`:'<p class="hint">クリアはありませんでした。休むのも冒険のうち</p>'}
    ${left.length?`<div class="sec-h"><span>残ったもの</span><span>${left.length}件</span></div><p class="hint">明日に持ち越されます</p><div class="kids">${revGroup(left,'◇')}</div>`:''}
    <div class="sec-h"><span>明日の予定</span><span>${tm.length}件</span></div>
    ${tm.length?`<div class="kids">${revGroup(tm,'◇')}</div>`:'<p class="hint">まだ予定はありません</p>'}
    <div class="sec-h"><span>ひとこと日記</span></div><textarea id="revNote" class="rev-note" placeholder="よかったこと・気づいたこと・明日の自分へ">${esc(note('d:'+key))}</textarea>
    <div class="rev-go"><button class="btn primary" data-act="revdone">今日の冒険を終える</button></div>`;
  }
  if(kind==='month'){
    const [y,m]=key.split('-').map(Number), a=key+'-01', b=ymd(new Date(y,m,0)), D=doneIn(a,b);
    const big=D.qs.filter(q=>q.type!=='mini'), mini=D.qs.length-big.length;
    const dn=Object.keys(state.rev.notes).filter(k=>k.startsWith('d:'+key)&&state.rev.notes[k].t).sort();
    h=`${monthMoonImg(m)}<div class="moon-k">MONTH END</div><h2>${m}月の冒険</h2><p class="rev-mname">${m}月の満月・${(MONTH_MOON[m-1]||[])[0]||''}</p><p class="moon-lead">ひと月をふり返って、来月の自分にひとこと</p>
    <div class="rev-stats"><div><b>${big.length}</b><span>チャレンジ</span></div><div><b>${mini}</b><span>ミニ</span></div><div><b>${D.steps.length}</b><span>工程</span></div><div><b>${D.tr}</b><span>鍛錬した日</span></div></div>
    ${big.length?`<div class="sec-h"><span>達成したチャレンジ</span></div><div class="kids">${big.map(q=>kidLine(ico(q.type,true)+' '+esc(q.title||'(無題)'),q.memory?esc(q.memory.split('\n')[0]):'')).join('')}</div>`:''}
    ${dn.length?`<div class="sec-h"><span>日記から</span><span>${dn.length}日</span></div><div class="kids">${dn.slice(-6).map(k=>kidLine(esc(note(k).split('\n')[0]),k.slice(7).replace('-','/'))).join('')}</div>`:''}
    <div class="sec-h"><span>この月をひとことで・来月やりたいこと</span></div><textarea id="revNote" class="rev-note" placeholder="例：引っ越しの段取りが進んだ。来月は鍛錬を続ける">${esc(note('m:'+key))}</textarea>
    <div class="rev-go"><button class="btn primary" data-act="revdone">この月を締めくくる</button></div>`;
  }
  if(kind==='season'){
    const c=state.chap.cur, D=doneIn(c.start,c.end), big=D.qs.filter(q=>q.type!=='mini');
    const mn=Object.keys(state.rev.notes).filter(k=>k.startsWith('m:')&&k.slice(2)>=c.start.slice(0,7)&&k.slice(2)<=c.end.slice(0,7)&&state.rev.notes[k].t).sort();
    const ns=ymd(new Date(new Date(c.end+'T00:00:00').getTime()+DAY));
    h=`<img class="rev-wide" src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/NASA-Apollo8-Dec24-Earthrise.jpg/1280px-NASA-Apollo8-Dec24-Earthrise.jpg" alt="月の地平線からのぼる地球" onerror="this.style.display='none'"><div class="moon-k">CHAPTER CLEAR</div><h2>第${c.n}章${c.theme?`「${esc(c.theme)}」`:''} 完</h2><p class="moon-lead">${c.start.replace(/-/g,'/')} 〜 ${c.end.replace(/-/g,'/')}${c.rule?`　ルール：${esc(c.rule)}`:''}</p>
    <div class="rev-stats"><div><b>${big.length}</b><span>チャレンジ</span></div><div><b>${D.qs.length-big.length}</b><span>ミニ</span></div><div><b>${D.steps.length}</b><span>工程</span></div><div><b>${D.tr}</b><span>鍛錬した日</span></div></div>
    ${big.length?`<div class="sec-h"><span>この章の冒険</span></div><div class="kids">${big.map(q=>kidLine(ico(q.type,true)+' '+esc(q.title||'(無題)'),q.memory?esc(q.memory.split('\n')[0]):'')).join('')}</div>`:''}
    ${mn.length?`<div class="sec-h"><span>月ごとのひとこと</span></div><div class="kids">${mn.map(k=>kidLine(esc(note(k).split('\n')[0]),+k.slice(7)+'月')).join('')}</div>`:''}
    <div class="sec-h"><span>この章をふり返って</span></div><textarea id="revNote" class="rev-note" placeholder="この章で変わったこと・次の章で変えたいこと">${esc(note('c:'+c.n))}</textarea>
    <div class="sec-h"><span>第${c.n+1}章（${ns.replace(/-/g,'/')} 〜 ${chEnd(ns).replace(/-/g,'/')}）</span></div>
    ${chapForm('',c.rule)}
    <div class="rev-go"><button class="btn primary" data-act="revdone">第${c.n+1}章をはじめる</button></div>`;
  }
  R.innerHTML=`<div class="moon-in"><button class="moon-x" data-act="revclose" aria-label="閉じる">✕</button>${h}</div>`;
  R.className='moon rev rev-'+kind+' show'; R.scrollTop=0;
}
function chapForm(theme,rule){
  return `<div class="form chap-form"><div class="f"><label>テーマ</label><input type="text" id="chTheme" value="${esc(theme||'')}" placeholder="例：身体をつくる章、家族と出かける章"></div>
  <div class="f"><label>この章だけのルール</label><input type="text" id="chRule" value="${esc(rule||'')}" placeholder="下から選ぶか、自分で書く"><div class="chips">${RULE_PRESETS.map(r=>`<button class="chip" data-act="chiprule" data-v="${esc(r)}">${esc(r)}</button>`).join('')}</div></div></div>`;
}
let revCur=null; const revSkip={};
function revDue(){
  const t=ymd(), now=new Date(), out=[];
  if(t>state.chap.cur.end) out.push(['season']);
  const pm=ymOf(new Date(now.getFullYear(),now.getMonth()-1,1)); if((state.rev.month||'')<pm) out.push(['month',pm]);
  const mk=moonDueKey(); if(state.moonDone!==mk&&(state.moonDone||'')<mk) out.push(['moon']);
  const dk=now.getHours()>=20?t:ymd(new Date(now.getTime()-DAY)); if((state.rev.day||'')<dk) out.push(['day',dk]);
  return out.filter(x=>!revSkip[x[0]]);
}
function revCheck(){
  if(state.pristine||editing) return;
  if($('rev').classList.contains('show')||$('moon').classList.contains('show')||$('shrine').classList.contains('show')) return;
  const d=revDue()[0]; if(!d) return;
  if(d[0]==='moon') openMoon(); else revOpen(d[0],d[1]);
}
function chapPanel(){
  const {c,pro,left,until}=chapNow();
  const recent=Object.keys(state.rev.notes).filter(k=>(k.startsWith('d:')||k.startsWith('m:'))&&state.rev.notes[k].t).sort().reverse().slice(0,12);
  return `<h2 class="p-title">${pro?'序章':`第${c.n}章`}</h2><div class="p-desc"><p>${pro?`第${c.n}章は ${c.start.replace(/-/g,'/')} から。それまでにテーマとルールを決めておこう。`:`${c.start.replace(/-/g,'/')} 〜 ${c.end.replace(/-/g,'/')}　残り${left}日。章が終わると振り返りが出て、次の章のテーマとルールを決めます。`}</p></div>
  <div class="sec-h"><span>第${c.n}章</span></div>
  <div class="form chap-form"><div class="f"><label>テーマ</label><input type="text" data-chap="theme" value="${esc(c.theme)}" placeholder="例：身体をつくる章、家族と出かける章"></div>
  <div class="f"><label>この章だけのルール</label><input type="text" data-chap="rule" value="${esc(c.rule)}" placeholder="下から選ぶか、自分で書く"><div class="chips">${RULE_PRESETS.map(r=>`<button class="chip ${c.rule===r?'on':''}" data-act="chaprule" data-v="${esc(r)}">${esc(r)}</button>`).join('')}</div></div></div>
  <div class="sec-h"><span>振り返り</span></div>
  <div class="rev-btns"><button class="btn small" data-act="revopen" data-v="day">今日の振り返り</button><button class="btn small" data-act="revopen" data-v="month">先月の振り返り</button><button class="btn small" data-act="openmoon">赤い月（週）</button></div>
  ${state.chap.hist.length?`<div class="sec-h"><span>これまでの章</span></div><div class="kids">${state.chap.hist.slice().reverse().map(h=>kidLine(`第${h.n}章${h.theme?`「${esc(h.theme)}」`:''}`,`${h.start.replace(/-/g,'/')} 〜 ${h.end.replace(/-/g,'/')}${h.rule?'　'+esc(h.rule):''}`)).join('')}</div>`:''}
  ${recent.length?`<div class="sec-h"><span>最近のひとこと</span></div><div class="kids">${recent.map(k=>kidLine(esc(note(k)).split('\n').join('<br>'),k[0]==='m'?`${+k.slice(7)}月の振り返り`:k.slice(7).replace('-','/'))).join('')}</div>`:''}`;
}
function moonDueKey(){ const d=new Date(), s=new Date(d); s.setHours(0,0,0,0); s.setDate(s.getDate()-s.getDay()); if(d.getDay()===0&&d.getHours()<18) s.setDate(s.getDate()-7); return ymd(s); }

/* ---------- 指スワイプで隣の区分へ（左右） ---------- */
function stepCat(dir){
  const i=CATS.indexOf(listCat); listCat=CATS[(i+(dir>0?1:CATS.length-1))%CATS.length];
  showCleared=false; miniOpen=false; selId=null; if(listCat==='today') dayView=ymd(); render();
  const L=$('list'); if(L){ L.classList.remove('slide-l','slide-r'); void L.offsetWidth; L.classList.add(dir>0?'slide-l':'slide-r'); }
}
(function(){
  let sx=0, sy=0, st=0, ok=false, top=false;
  // 画面のどこをスワイプしても切り替わる（説明パネルを開いている時・入力中は除く）
  const col=document;
  col.addEventListener('touchstart',e=>{
    const t=e.touches[0], mobile=window.innerWidth<=820;
    top = e.touches.length===1 && !editing && !!e.target.closest('.topbar');
    ok = !top && e.touches.length===1 && tab==='list' && !editing && !(mobile&&selId) && !e.target.closest('#detail,.hints,input,textarea,select,[data-drag],.week');
    sx=t.clientX; sy=t.clientY; st=Date.now();
  },{passive:true});
  col.addEventListener('touchend',e=>{
    if(!ok&&!top) return;
    const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(top){ top=false; ok=false;
      // 上の「冒険手帳／道具」の帯を左右に払うと、冒険手帳と道具が切り替わる
      if(Date.now()-st<700 && Math.abs(dx)>50 && Math.abs(dy)<Math.abs(dx)*0.8){ const order=['list','pouch','rest','tools'], nt=order[Math.max(0,Math.min(order.length-1,order.indexOf(tab)+(dx<0?1:-1)))]; if(nt!==tab){ tab=nt; if(window.innerWidth<=820) selId=null; render(); const L=$('list'); if(L){ L.classList.remove('slide-l','slide-r'); void L.offsetWidth; L.classList.add(dx<0?'slide-l':'slide-r'); } } }
      return; }
    ok=false;
    if(Date.now()-st<700 && Math.abs(dx)>60 && Math.abs(dy)<Math.abs(dx)*0.6) stepCat(dx<0?1:-1);
  },{passive:true});
})();

/* ---------- キーボード操作（←→で区分、↑↓で選択、Escで閉じる） ---------- */
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(tab!=='list'||editing) return;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ const i=CATS.indexOf(listCat); listCat=CATS[(i+(e.key==='ArrowRight'?1:CATS.length-1))%CATS.length]; selId=null; showCleared=false; miniOpen=false; render(); e.preventDefault(); }
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    const ids=[...document.querySelectorAll('#list .row[data-id]')].map(x=>x.dataset.id); if(!ids.length) return;
    let i=ids.indexOf(selId); i= i<0 ? 0 : Math.min(ids.length-1,Math.max(0,i+(e.key==='ArrowDown'?1:-1)));
    selId=ids[i]; render(); const el=document.querySelector(`#list .row[data-id="${selId}"]`); el&&el.scrollIntoView({block:'nearest'}); e.preventDefault();
  }
  else if(e.key==='Escape'&&selId){ selId=null; render(); }
});

/* ---------- PCとスマホのデータ同期 ---------- */
let qSigs=null;
function stamp(){
  const now=Date.now(); state.deleted=state.deleted||{}; const cur={};
  state.quests.forEach(q=>{ const {u,...rest}=q; const sg=JSON.stringify(rest); cur[q.id]=sg;
    if(qSigs&&qSigs[q.id]!==sg){ q.u=now; state.pristine=false; } if(!q.u) q.u=q.created||now; });
  if(qSigs) Object.keys(qSigs).forEach(id=>{ if(!cur[id]){ state.deleted[id]=now; state.pristine=false; } });
  const ex=[state.xp,state.seeds||0,state.moonDone||'',Object.keys(state.rested||{}).length,hmRev(),state.rupeeEarned||0,state.shrines||0,Object.keys(state.purchases||{}).length,JSON.stringify(state.shop||{}),JSON.stringify(state.chap||{}),JSON.stringify(state.rev||{}),JSON.stringify(state.mats||{}),JSON.stringify(state.matHist||{})].join('|');
  if(qSigs&&ex!==stamp.ex) state.pristine=false;
  stamp.ex=ex;
  Object.keys(state.deleted).forEach(id=>{ if(now-state.deleted[id]>90*DAY) delete state.deleted[id]; });
  qSigs=cur;
}
function mergeStates(a,b){
  const del={...(a.deleted||{})};
  Object.entries(b.deleted||{}).forEach(([k,v])=>{ if(!del[k]||del[k]<v) del[k]=v; });
  const map={};
  [...(a.quests||[]),...(b.quests||[])].forEach(q=>{ const e=map[q.id]; if(!e||(q.u||0)>(e.u||0)) map[q.id]=q; });
  const quests=Object.values(map).filter(q=>!(del[q.id]&&del[q.id]>=(q.u||0)));
  return {xp:Math.max(a.xp||0,b.xp||0),seeds:Math.max(a.seeds||0,b.seeds||0),rested:{...(a.rested||{}),...(b.rested||{})},hm:mergeHm(a.hm,b.hm),rupeeEarned:Math.max(a.rupeeEarned||0,b.rupeeEarned||0),shrines:Math.max(a.shrines||0,b.shrines||0),purchases:{...(a.purchases||{}),...(b.purchases||{})},shop:(()=>{const o={...(a.shop||{})}; Object.entries(b.shop||{}).forEach(([k,v])=>{ if(!o[k]||(v.u||0)>(o[k].u||0)) o[k]=v; }); return o;})(),moonDone:[a.moonDone||'',b.moonDone||''].sort().pop(),mats:(()=>{const o={...(a.mats||{})}; Object.entries(b.mats||{}).forEach(([k,v])=>{ if(!o[k]||(v.u||0)>(o[k].u||0)) o[k]=v; }); return o;})(),matHist:(()=>{const o={...(a.matHist||{})}; Object.entries(b.matHist||{}).forEach(([k,v])=>{ o[k]=Math.max(o[k]||0,v); }); return o;})(),chap:((b.chap&&(b.chap.u||0)>((a.chap||{}).u||0))?b.chap:(a.chap||b.chap)),rev:(()=>{const A=a.rev||{},B=b.rev||{},n={...(A.notes||{})}; Object.entries(B.notes||{}).forEach(([k,v])=>{ if(!n[k]||(v.u||0)>(n[k].u||0)) n[k]=v; }); return {day:[A.day||'',B.day||''].sort().pop(),month:[A.month||'',B.month||''].sort().pop(),notes:n,u:Math.max(A.u||0,B.u||0)};})(),quests,deleted:del,pristine:false};
}
function fingerprint(st){ return JSON.stringify([(st.quests||[]).map(q=>q.id+':'+(q.u||0)).sort(),st.xp||0,st.seeds||0,Object.keys(st.rested||{}).length,st.moonDone||'',st.rupeeEarned||0,st.shrines||0,Object.keys(st.purchases||{}).length,JSON.stringify(st.shop||{}).length,((st.chap||{}).u||0),((st.rev||{}).u||0),Object.values(st.mats||{}).reduce((m,v)=>Math.max(m,v.u||0),0),(()=>{const u=(st.hm||{}).u||{};let m=0;for(const k in u)if(u[k]>m)m=u[k];return m})()]); }
function applyState(ns){
  state=ns; if(!Array.isArray(state.quests)) state.quests=[];
  migrate(); qSigs=null; stamp();
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  syncScan();
  if(selId&&!findQ(selId)){ selId=null; editing=false; }
  if(editing){ renderLv(); renderHud(); renderTabs(); renderList(); } else render();
  if(window.__qlReady&&(carryOver()+moveDoToSteps())){ save(); render(); }
}
let pushT=null, pushing=false, pushAgain=false;
function schedulePush(ms=1500){ if(!sync.url) return; clearTimeout(pushT); pushT=setTimeout(pushData,ms); }
async function pushData(){
  if(!sync.url) return; if(pushing){ pushAgain=true; return; }
  pushing=true;
  try{
    const j=await gas({action:'save',data:state,baseRev:sync.rev||0});
    if(j.conflict){ sync.rev=j.rev; saveSync(); applyState(mergeStates(state,j.data||{})); pushAgain=true; }
    else { sync.rev=j.rev; sync.dataAt=Date.now(); sync.err=''; saveSync(); refreshStatus(); }
  }catch(err){ sync.err=String(err.message||err); saveSync(); refreshStatus(); clearTimeout(pushT); pushT=setTimeout(pushData,30000); }
  finally{ pushing=false; if(pushAgain){ pushAgain=false; schedulePush(300); } }
}
async function loadData(){
  if(!sync.url||pushing) return;
  try{
    const j=await gas({action:'load'});
    if(sync.err){ sync.err=''; saveSync(); refreshStatus(); }
    if(!j.data){ schedulePush(100); return; }
    if(j.rev===sync.rev) return;
    const m=state.pristine ? {...j.data,pristine:false} : mergeStates(state,j.data);
    sync.rev=j.rev; sync.dataAt=Date.now(); saveSync();
    const needPush=fingerprint(m)!==fingerprint(j.data);
    const changed=fingerprint(m)!==fingerprint(state);
    applyState(m);
    if(changed) toast('ほかの端末の変更を反映しました');
    if(needPush) schedulePush(200);
  }catch(e){}
}
setInterval(()=>{ if(ymd()!==carryDay) runCarry(); if(document.visibilityState==='visible') loadData(); },30000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(ymd()!==carryDay) runCarry(); loadData(); } });

// #q=ID で開いたら、そのチャレンジを表示
(function(){ const m=location.hash.match(/^#q=([\w-]+)/); const q=m&&findQ(m[1]); if(q){ selId=q.id; tab='list'; listCat=q.type; } if(m){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} } })();

stamp(); window.__qlReady=true;
render(); if(moveDoToSteps()){ save(); render(); } if(trImport()){ state.pristine=false; save(); render(); } runCarry();
if(sync.url){ syncScan(); flush(); loadData().then(pull); }
})();
</script>
